<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade | Kiran Yarlagadda</title>
    <meta
      name="description"
      content="Browser games, each one wrapped in a drop-in HTML tag."
    />
    <link rel="icon" href="/arcade/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/arcade/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/arcade/apple-touch-icon.png" />
    <link rel="stylesheet" href="/arcade/arcade.css" />
  </head>
  <body>
    <!-- The cabinet scene lives here for the intro and the select screen. It
         gets removed entirely while a game is showing, so the game gets the
         whole frame budget, then rebuilt on the way back out. -->
    <div id="sceneHost" class="scene-host"></div>

    <!-- ================================================================
         Intro: the cabinet full-bleed at zoom 0, animated up to zoom 1,
         then crossfaded into the select screen. Once per session. -->
    <div id="intro" class="intro">
      <a class="intro-brand" href="/projects.html">
        <svg class="mark" viewBox="0 0 64 64" width="14" height="14" aria-hidden="true">
          <circle cx="16" cy="16" r="4.6" fill="#5c6478" />
          <circle cx="32" cy="16" r="4.6" fill="#5c6478" />
          <circle cx="48" cy="16" r="4.6" fill="#5c6478" />
          <circle cx="16" cy="32" r="4.6" fill="#5c6478" />
          <circle cx="48" cy="32" r="4.6" fill="#5c6478" />
          <circle cx="16" cy="48" r="4.6" fill="#5c6478" />
          <circle cx="32" cy="48" r="4.6" fill="#5c6478" />
          <circle cx="48" cy="48" r="4.6" fill="#5c6478" />
          <circle cx="32" cy="32" r="4.6" fill="#ffb454" />
          <circle cx="32" cy="32" r="8" fill="none" stroke="#ffb454" stroke-opacity="0.45" stroke-width="1.8" />
        </svg>
        <span>arc<b>ade</b></span>
      </a>
      <p class="intro-skip">click to skip</p>
    </div>

    <!-- ================================================================
         Select screen: the brand, then a row of game tiles built from the
         package's GAME_NAMES and GAME_INFO. The cabinet stays lit behind
         it at zoom 1, under a scrim and a CRT overlay. -->
    <div id="select" class="select" hidden>
      <header class="select-brand">
        <svg class="mark" viewBox="0 0 64 64" width="24" height="24" aria-hidden="true">
          <circle cx="16" cy="16" r="4.6" fill="#5c6478" />
          <circle cx="32" cy="16" r="4.6" fill="#5c6478" />
          <circle cx="48" cy="16" r="4.6" fill="#5c6478" />
          <circle cx="16" cy="32" r="4.6" fill="#5c6478" />
          <circle cx="48" cy="32" r="4.6" fill="#5c6478" />
          <circle cx="16" cy="48" r="4.6" fill="#5c6478" />
          <circle cx="32" cy="48" r="4.6" fill="#5c6478" />
          <circle cx="48" cy="48" r="4.6" fill="#5c6478" />
          <circle cx="32" cy="32" r="4.6" fill="#ffb454" />
          <circle cx="32" cy="32" r="8" fill="none" stroke="#ffb454" stroke-opacity="0.45" stroke-width="1.8" />
        </svg>
        <span>arc<b>ade</b></span>
      </header>
      <div id="tiles" class="tiles" role="list" aria-label="Games"></div>
    </div>

    <!-- ================================================================
         Game screen: the arcade-game tag, centred and dominant. A slim bar
         runs above it, a results strip fills in below it, and the schema
         controls live in a drawer that slides in from the side. -->
    <div id="game" class="game" hidden>
      <div class="game-bar">
        <button id="back" class="back" type="button">
          <span aria-hidden="true">&larr;</span> arcade
        </button>
        <h1 id="gameTitle" class="game-title"></h1>
        <output id="state" class="state" aria-label="game state">idle</output>
        <button id="gear" class="gear" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Controls">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6" />
            <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="2.5" x2="12" y2="5.5" />
              <line x1="12" y1="18.5" x2="12" y2="21.5" />
              <line x1="2.5" y1="12" x2="5.5" y2="12" />
              <line x1="18.5" y1="12" x2="21.5" y2="12" />
              <line x1="5.3" y1="5.3" x2="7.4" y2="7.4" />
              <line x1="16.6" y1="16.6" x2="18.7" y2="18.7" />
              <line x1="18.7" y1="5.3" x2="16.6" y2="7.4" />
              <line x1="7.4" y1="16.6" x2="5.3" y2="18.7" />
            </g>
          </svg>
        </button>
      </div>

      <div class="stage">
        <arcade-game id="stage"></arcade-game>
      </div>

      <section class="results" id="results" hidden>
        <dl id="stats" class="stats"></dl>
      </section>

      <aside class="drawer" id="drawer" aria-label="Game controls" hidden>
        <div class="drawer-head">
          <h2>Controls</h2>
          <div class="drawer-head-buttons">
            <button id="reset" class="ghost" type="button">reset</button>
            <button id="drawerClose" class="ghost" type="button">close</button>
          </div>
        </div>
        <div id="controls" class="controls"></div>
      </aside>
    </div>

    <script type="module" src="/assets/arcade.js"></script>
  </body>
</html>
